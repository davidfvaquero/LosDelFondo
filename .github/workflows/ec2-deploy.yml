name: EC2 Deploy

on:
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.select.outputs.branch }}
      target_branch: ${{ steps.select.outputs.target_branch }}
      environment: ${{ steps.select.outputs.environment }}
    steps:
      - name: Select branch and environment
        id: select
        run: |
          branch="${{ github.ref_name }}"
          target_branch="${{ github.ref_name }}"

          case "$target_branch" in
            main)
              environment="Production"
              ;;
            dev)
              environment="staging"
              ;;
            api)
              environment="api"
              ;;
            *)
              echo "Unsupported branch for EC2 deploy: $branch"
              exit 1
              ;;
          esac

          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "target_branch=$target_branch" >> "$GITHUB_OUTPUT"
          echo "environment=$environment" >> "$GITHUB_OUTPUT"

  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ needs.prepare.outputs.environment }}

    steps:
      - name: Validate required secrets
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
          EC2_APP_DIR: ${{ secrets.EC2_APP_DIR }}
          EC2_SYSTEMD_SERVICE: ${{ secrets.EC2_SYSTEMD_SERVICE }}
        run: |
          for secret_name in EC2_HOST EC2_USER EC2_SSH_PRIVATE_KEY EC2_KNOWN_HOSTS EC2_APP_DIR EC2_SYSTEMD_SERVICE; do
            if [ -z "${!secret_name}" ]; then
              echo "Missing required secret: $secret_name"
              exit 1
            fi
          done

      - name: Configure SSH
        env:
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy on EC2 through SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_APP_DIR: ${{ secrets.EC2_APP_DIR }}
          EC2_SYSTEMD_SERVICE: ${{ secrets.EC2_SYSTEMD_SERVICE }}
          DEPLOY_BRANCH: ${{ needs.prepare.outputs.branch }}
        run: |
          ssh "$EC2_USER@$EC2_HOST" \
            "cd '$EC2_APP_DIR' && DEPLOY_BRANCH='$DEPLOY_BRANCH' EC2_SYSTEMD_SERVICE='$EC2_SYSTEMD_SERVICE' bash scripts/deploy_ec2.sh"
