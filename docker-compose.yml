services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: deportedata-api:latest
    container_name: deportedata-api
    restart: unless-stopped
    environment:
      S3_BUCKET: ${S3_BUCKET:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      DB_HOST: ${DB_HOST:-}
      DB_NAME: ${DB_NAME:-deportedata}
      DB_USER: ${DB_USER:-deporteadmin}
      DB_PASSWORD: ${DB_PASSWORD:-}
      CHAT_LOGS_FILE: /app/chat_logs/chat_logs.jsonl
      PYTHONIOENCODING: utf-8
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    volumes:
      - models_cache:/app/models
      - chat_logs:/app/chat_logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 3600s

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    image: deportedata-dashboard:latest
    container_name: deportedata-dashboard
    restart: unless-stopped
    environment:
      API_URL: http://api:8000
      DEPORTEDATA_API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  proxy:
    image: nginx:1.27-alpine
    container_name: deportedata-proxy
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      dashboard:
        condition: service_healthy
    ports:
      - "80:80"
      - "8000:8000"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  models_cache:
    driver: local
  chat_logs:
    driver: local
